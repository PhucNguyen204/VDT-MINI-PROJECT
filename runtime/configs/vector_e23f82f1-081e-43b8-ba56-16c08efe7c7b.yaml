data_dir: /var/lib/vector
api:
  enabled: true
  address: 0.0.0.0:8686
  playground: true
telemetry:
  metrics:
    enabled: true
sources:
  web_traffic:
    type: http_server
    address: 0.0.0.0:8090
  system_files:
    type: file
    include:
      - D:/demo_VDT/runtime/logs/*.log
      - D:/demo_VDT/runtime/logs/*.txt
    exclude:
      - D:/demo_VDT/runtime/logs/*debug*
    ignore_older_secs: 86400
    max_read_bytes: 4096
    start_at_beginning: true
    fingerprint:
      strategy: checksum
      ignored_header_bytes: 0
transforms:
  web_traffic_parse_0:
    type: remap
    inputs:
      - web_traffic
    source: |
      # Thử parse JSON, nếu thành công thì merge, nếu không thì giữ nguyên
      parsed, err = parse_json(.message)
      if err == null {
        . = merge!(., parsed)
      }
      # Đảm bảo có timestamp
      if !exists(.timestamp) {
        .timestamp = now()
      }
  web_traffic_enrich_1:
    type: remap
    inputs:
      - web_traffic_parse_0
    source: |
      .pipeline = "web-file-monitoring"
      if !exists(.source_type) {
        .source_type = "web_traffic"
      }
      # Thêm cluster info nếu có
      if !is_empty("${CLUSTER_ID-}") {
        .cluster_id = "${CLUSTER_ID-}"
      }
      # Thêm environment info
      if !is_empty("${ENVIRONMENT-}") {
        .environment = "${ENVIRONMENT-}"
      }
  system_files_parse_0:
    type: remap
    inputs:
      - system_files
    source: |
      # Thử parse JSON, nếu thành công thì merge, nếu không thì giữ nguyên
      parsed, err = parse_json(.message)
      if err == null {
        . = merge!(., parsed)
      }
      # Đảm bảo có timestamp
      if !exists(.timestamp) {
        .timestamp = now()
      }
  system_files_reduce_1:
    type: remap
    inputs:
      - system_files_parse_0
    source: |
      . = {
        "timestamp": .timestamp,
        "message": .message,
        "pipeline": .pipeline,
        "source_type": .source_type
      }

      # Thêm container_name chỉ nếu tồn tại (cho Docker logs)
      if exists(.container_name) {
        .container_name = .container_name
      }

      # Thêm cluster_id nếu có
      if exists(.cluster_id) {
        .cluster_id = .cluster_id
      }

      # Thêm environment nếu có
      if exists(.environment) {
        .environment = .environment
      }
sinks:
  web_traffic_console_0:
    type: console
    inputs:
      - web_traffic_enrich_1
    encoding:
      codec: json
  web_traffic_s3_1:
    type: aws_s3
    inputs:
      - web_traffic_enrich_1
    bucket: phucnguyen204
    region: ap-southeast-2
    key_prefix: custom-logs/web_traffic/%Y/%m/%d/
    compression: gzip
    encoding:
      codec: json
    batch:
      max_events: 1
      timeout_secs: 10
  system_files_cloudwatch_logs_0:
    type: aws_cloudwatch_logs
    inputs:
      - system_files_reduce_1
    region: us-west-2
    group_name: /custom-pipeline/
    stream_name: system_files-2025-06-08
    encoding:
      codec: json
  system_files_console_1:
    type: console
    inputs:
      - system_files_reduce_1
    encoding:
      codec: json
