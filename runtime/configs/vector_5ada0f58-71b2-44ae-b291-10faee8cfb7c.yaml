data_dir: /var/lib/vector
api:
  enabled: true
  address: 0.0.0.0:8686
  playground: true
telemetry:
  metrics:
    enabled: true
sources:
  file_in:
    type: file
    include:
      - /var/log/app/*.log
    exclude: []
    read_from: beginning
    ignore_older_secs: 86400
    max_read_bytes: 2048
    start_at_beginning: true
    fingerprint:
      strategy: checksum
      ignored_header_bytes: 0
transforms:
  parse_logs:
    type: remap
    inputs:
      - file_in
    source: |
      # Thử parse JSON, nếu thành công thì merge, nếu không thì giữ nguyên
      parsed, err = parse_json(.message)
      if err == null {
        . = merge!(., parsed)
      }
      # Đảm bảo có timestamp
      if !exists(.timestamp) {
        .timestamp = now()
      }
  enrich_tag:
    type: remap
    inputs:
      - parse_logs
    source: |
      .pipeline = "demo"
      if !exists(.source_type) {
        .source_type = "unknown"
      }
  reduce_keep:
    type: remap
    inputs:
      - enrich_tag
    source: |
      . = {
        "timestamp": .timestamp,
        "message": .message,
        "pipeline": .pipeline,
        "source_type": .source_type
      }

      # Thêm container_name chỉ nếu tồn tại (cho Docker logs)
      if exists(.container_name) {
        .container_name = .container_name
      }
sinks:
  console_debug:
    type: console
    inputs:
      - reduce_keep
    encoding:
      codec: json
  s3_output:
    type: aws_s3
    inputs:
      - reduce_keep
    bucket: phucnguyen204
    region: ap-southeast-2
    key_prefix: file-logs/%Y/%m/%d/
    compression: gzip
    encoding:
      codec: json
    batch:
      max_events: 1
      timeout_secs: 10
