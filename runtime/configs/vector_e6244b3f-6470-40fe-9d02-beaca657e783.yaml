data_dir: /var/lib/vector
api:
  enabled: true
  address: 0.0.0.0:8686
  playground: true
telemetry:
  metrics:
    enabled: true
sources:
  source_1:
    type: file
    include:
      - /runtime/logs/*.log
    exclude: []
    ignore_older_secs: 86400
    max_read_bytes: 2048
    start_at_beginning: true
    fingerprint:
      strategy: checksum
      ignored_header_bytes: 0
transforms:
  source_1_parse_0:
    type: remap
    inputs:
      - source_1
    source: |
      # Thử parse JSON, nếu thành công thì merge, nếu không thì giữ nguyên
      parsed, err = parse_json(.message)
      if err == null {
        . = merge!(., parsed)
      }
      # Đảm bảo có timestamp
      if !exists(.timestamp) {
        .timestamp = now()
      }
  source_1_enrich_1:
    type: remap
    inputs:
      - source_1_parse_0
    source: |
      .pipeline = "phuc yeu phuong"
      if !exists(.source_type) {
        .source_type = "source_1"
      }
      # Thêm cluster info nếu có
      if !is_empty("${CLUSTER_ID-}") {
        .cluster_id = "${CLUSTER_ID-}"
      }
      # Thêm environment info
      if !is_empty("${ENVIRONMENT-}") {
        .environment = "${ENVIRONMENT-}"
      }
sinks:
  source_1_s3_0:
    type: aws_s3
    inputs:
      - source_1_enrich_1
    bucket: phucnguyen204
    region: ap-southeast-2
    key_prefix: custom-logs/source_1/%Y/%m/%d/
    compression: gzip
    encoding:
      codec: json
    batch:
      max_events: 1
      timeout_secs: 10
