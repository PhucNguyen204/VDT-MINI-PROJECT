sinks:
  console_debug:
    type: console
    inputs: ["reduce_keep"]
    encoding:
      codec: json
  s3_demo:
    type: aws_s3
    inputs: ["reduce_keep"]
    bucket: phucnguyen204
    region: ap-southeast-2
    key_prefix: demo/%Y/%m/%d/
    compression: gzip
    encoding:
      codec: json
    batch:
      max_events: 1
      timeout_secs: 10